<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dues hero scenes</title>
<!--
  Authoring surface for the hero film's designed beats. NOT shipped: it is loaded
  over file:// by scripts/record-hero.mjs and captured at deviceScaleFactor 2, so
  a 1920x1080 layout lands as 3840x2160 native pixels.

  WHY THIS EXISTS. The founder kept exactly two beats out of the old cut — the
  opening title and the new-subscriber alerts — and cut every raw dashboard
  screencast in between. Those two are the only beats that were composed motion
  graphics rather than a cursor wandering a UI. That is the brief: the film has to
  be designed, not recorded. This file is where the designed beats live.

  EVERY ANIMATION IS DRIVEN BY window.__seek(t), NOT BY CSS OR requestAnimationFrame.
  A screenshot takes far longer than a frame interval, so anything tied to wall
  clock would desync and stutter. The recorder sets an explicit time, screenshots,
  advances. The result is a perfect 30fps regardless of how slow capture is, and
  the same t always produces the same pixels — so a re-shoot months from now is
  frame-identical and the cut still lines up.
-->
<style>
  /* Installed system-wide by the font pipeline (assets/fonts/README.md). Named
     rather than @font-face'd because fontconfig already resolves them and
     Chromium picks them up by family. */
  :root {
    --bg: #0a0a0a;
    --panel: #101010;
    --panel-2: #1d1d1d;
    --edge: #232323;
    --ink: #f5f5f4;
    --dim: #9a9a94;
    /* The REAL sale alert. src/services/stripe-events.js posts color: 0xffffff,
       which Discord paints as the embed's left stripe — so the film shows white,
       not green. #22c55e is not a product token: the monochrome rebrand replaced
       --good with #ededed and the green survives only in the landing page's
       savings calculator. Painting it here would advertise an embed Dues has
       never sent. */
    --good: #ffffff;
    --grotesk: 'Dues Grotesk', 'Space Grotesk', system-ui, sans-serif;
    --sans: 'Dues Sans', 'DM Sans', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    /* Screen recordings of dark UI show banding badly once compressed; the
       browser's own subpixel AA also fights the encoder. Greyscale AA keeps
       glyph edges clean through a 2:1 downscale. */
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: absolute; inset: 0; display: none; }
  .stage.on { display: block; }

  /* ── brand ──────────────────────────────────────────────────────────────── */
  #brand .lockup {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 26px;
    will-change: transform, opacity;
  }
  #brand .mark { display: flex; align-items: center; gap: 22px; }
  #brand .mark img { height: 76px; width: auto; display: block; }
  #brand .tag { font-size: 27px; letter-spacing: -0.01em; color: var(--dim); }
  #brand .tag b { color: var(--ink); font-weight: 700; }

  /* ── alerts ─────────────────────────────────────────────────────────────── */
  #alerts .panel {
    position: absolute; left: 50%; top: 50%;
    width: 1080px;
    transform: translate(-50%, -50%);
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 16px;
    box-shadow: 0 60px 120px rgba(0,0,0,0.65);
    overflow: hidden;
    will-change: transform, opacity;
  }
  #alerts .chan {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 30px;
    border-bottom: 1px solid var(--edge);
    font-family: var(--grotesk); font-weight: 700; font-size: 22px;
  }
  #alerts .chan i { font-style: normal; color: var(--dim); font-size: 26px; }
  /* Fixed height, clipped. 626px is MEASURED, not guessed: it is the feed's
     scrollHeight with all four cards laid out (4 x 145px card + 20/26 padding).
     Fixed so the panel never resizes mid-shot — a container that grows as cards
     land reads as a bug rather than as motion — and clipped so nothing can ride
     up over the channel header, which an earlier scroll-lift version did. */
  #alerts .feed { padding: 20px 30px 26px; height: 626px; overflow: hidden; }
  #alerts .msg { display: flex; gap: 18px; padding: 14px 0; will-change: transform, opacity; }
  #alerts .av {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: var(--panel-2); border: 1px solid var(--edge);
    display: grid; place-items: center;
    font-family: var(--grotesk); font-weight: 700; font-size: 20px; color: var(--ink);
  }
  #alerts .body { flex: 1; }
  #alerts .who { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  #alerts .who b { font-family: var(--grotesk); font-size: 19px; }
  #alerts .bot {
    background: #4d4d4d; color: #fff; font-size: 11px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; letter-spacing: 0.06em;
  }
  #alerts .when { color: var(--dim); font-size: 15px; }
  #alerts .embed {
    background: var(--panel-2);
    border-left: 4px solid var(--good);
    border-radius: 5px;
    padding: 15px 18px;
  }
  #alerts .embed strong { display: block; font-size: 19px; margin-bottom: 6px; }
  #alerts .embed span { font-size: 17px; color: #c9cec7; }
  #alerts .embed span em { font-style: normal; color: var(--ink); font-weight: 700; }

  /* ── burst ──────────────────────────────────────────────────────────────── */
  /* The beat the whole film is judged on. The adversarial pass measured the
     reference's burst at ~4x the frame-delta of any other beat, sustained 2.0s,
     and warned that a DARK pinwheel would get the film rejected a fifth time.
     So the wedge cycle is [ink, bg, ink, blurple] — white is the accent in a
     monochrome system, and the twelve --bg wedges cost nothing to paint
     because they ARE the ground. */
  #burst .stage-in { position: absolute; inset: 0; overflow: hidden; }
  #burst .wheelwrap {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    will-change: filter;
  }
  /* Fixed-size element with an animated mask radius, NOT a scaled 4600px div:
     it keeps the painted area bounded to the frame instead of asking the
     compositor to rasterise a surface three times the viewport. */
  #burst .wheel {
    position: absolute; width: 3400px; height: 3400px;
    left: 50%; top: 50%; margin: -1700px 0 0 -1700px;
    background: conic-gradient(from 0deg,
      #f5f5f4 0deg 15deg, #0a0a0a 15deg 30deg, #f5f5f4 30deg 45deg, #5865f2 45deg 60deg,
      #f5f5f4 60deg 75deg, #0a0a0a 75deg 90deg, #f5f5f4 90deg 105deg, #5865f2 105deg 120deg,
      #f5f5f4 120deg 135deg, #0a0a0a 135deg 150deg, #f5f5f4 150deg 165deg, #5865f2 165deg 180deg,
      #f5f5f4 180deg 195deg, #0a0a0a 195deg 210deg, #f5f5f4 210deg 225deg, #5865f2 225deg 240deg,
      #f5f5f4 240deg 255deg, #0a0a0a 255deg 270deg, #f5f5f4 270deg 285deg, #5865f2 285deg 300deg,
      #f5f5f4 300deg 315deg, #0a0a0a 315deg 330deg, #f5f5f4 330deg 345deg, #5865f2 345deg 360deg);
    will-change: transform, -webkit-mask-image;
  }
  #burst .stars { position: absolute; inset: 0; will-change: transform; }
  #burst .stars svg { position: absolute; overflow: visible; }
  /* The chip is a SIBLING of .wheelwrap, never a descendant: the exit blurs the
     wheel to 36px, and the whole point of the shot is a razor-sharp subject
     against a destroyed world. */
  #burst .depth { position: absolute; inset: 0; perspective: 2000px; }
  #burst .group { position: absolute; inset: 0; transform-style: preserve-3d; }
  #burst .chip, #burst .pill {
    position: absolute; left: 50%; top: 50%;
    display: flex; align-items: center; gap: 12px;
    padding: 16px 26px; border-radius: 999px;
    font-family: var(--grotesk); font-weight: 700; white-space: nowrap;
    box-shadow: 0 22px 48px rgba(0, 0, 0, 0.5);
    will-change: transform, opacity;
  }
  #burst .chip {
    background: var(--bg); border: 2px solid var(--ink); color: var(--ink);
    font-size: 68px; padding: 26px 52px;
  }
  #burst .chip i { width: 24px; height: 24px; border-radius: 50%; background: #5865f2; display: block; }
  #burst .pill { font-size: 29px; border: 0; padding: 17px 30px; }
  #burst .bloom {
    position: absolute; left: 50%; top: 50%; width: 900px; height: 900px;
    margin: -450px 0 0 -450px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,245,244,0.9) 0%, rgba(245,245,244,0) 68%);
    mix-blend-mode: screen; will-change: transform, opacity;
  }
</style>
</head>
<body>

<div class="stage" id="brand">
  <div class="lockup">
    <div class="mark"><img src="../assets/dues-mark.png" alt="Dues" /></div>
    <div class="tag">Sell Discord roles. <b>Keep every dollar.</b></div>
  </div>
</div>


<div class="stage" id="burst">
  <div class="stage-in">
    <div class="wheelwrap"><div class="wheel"></div><div class="stars"></div></div>
    <div class="bloom"></div>
    <div class="depth"><div class="group">
      <div class="chip"><i></i>@VIP</div>
    </div></div>
  </div>
</div>

<div class="stage" id="alerts">
  <div class="panel">
    <div class="chan"><i>#</i> sale-alerts</div>
    <div class="feed"></div>
  </div>
</div>

<script>
// ── timing helpers ────────────────────────────────────────────────────────────
// One easing curve for the whole film. Mixing curves is what makes motion read as
// assembled from parts; a single expressive out-curve reads as one hand.
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
// Progress of a segment that starts at `at` and runs for `dur`, eased.
const seg = (t, at, dur, ease = outExpo) => ease(clamp01((t - at) / dur));
const lerp = (a, b, p) => a + (b - a) * p;

// ── scene: brand ──────────────────────────────────────────────────────────────
// The title is the first thing anyone sees, so it cannot look like a slide. The
// mark settles, the wordmark lifts with it, the line arrives a beat later, and
// then the whole lockup keeps drifting almost imperceptibly so the frame is never
// dead. A still title card is what makes a hero read as cheap.
const BRAND = {
  duration: 2.6,
  apply(t) {
    const lockup = document.querySelector('#brand .lockup');
    const mark = document.querySelector('#brand .mark');
    const tag = document.querySelector('#brand .tag');

    const inMark = seg(t, 0.10, 0.85);
    const inTag = seg(t, 0.55, 0.80);
    // A drift this small is invisible as motion but keeps the compressor from
    // seeing a frozen frame — and a frozen frame is what "cheap" looks like.
    const drift = lerp(1.0, 1.018, clamp01(t / BRAND.duration));

    lockup.style.transform = `translate(-50%, -50%) scale(${drift.toFixed(5)})`;
    mark.style.opacity = inMark.toFixed(4);
    mark.style.transform = `translateY(${lerp(16, 0, inMark).toFixed(3)}px)`;
    tag.style.opacity = inTag.toFixed(4);
    tag.style.transform = `translateY(${lerp(12, 0, inTag).toFixed(3)}px)`;
  },
};

// ── scene: alerts ─────────────────────────────────────────────────────────────
// The payoff beat: money landing in Discord. Cards arrive one at a time on a
// steady pulse so it reads as events happening, not a list rendering. The feed
// eases upward as it fills, which is what a real channel does and what makes the
// shot feel live rather than staged.
const SALES = [
  { user: '@drift139', product: 'Inner Circle', price: '$79.99' },
  { user: '@nova142', product: 'VIP Access', price: '$49.99' },
  { user: '@halo151', product: 'Signals Monthly', price: '$14.99' },
  { user: '@sirius147', product: 'VIP Access', price: '$49.99' },
];
const ALERT_AT = [0.55, 1.25, 1.95, 2.65]; // one every 0.70s — a heartbeat, not a burst

const ALERTS = {
  duration: 3.9,
  build() {
    const feed = document.querySelector('#alerts .feed');
    feed.innerHTML = SALES.map((s) => `
      <div class="msg">
        <div class="av">D</div>
        <div class="body">
          <div class="who"><b>Dues</b><span class="bot">BOT</span><span class="when">Today</span></div>
          <div class="embed">
            <strong>New Subscriber!</strong>
            <span>${s.user} just bought ${s.product} · <em>${s.price}</em></span>
          </div>
        </div>
      </div>`).join('');
  },
  apply(t) {
    const panel = document.querySelector('#alerts .panel');
    const feed = document.querySelector('#alerts .feed');
    const msgs = [...document.querySelectorAll('#alerts .msg')];

    const inPanel = seg(t, 0, 0.5);
    panel.style.opacity = inPanel.toFixed(4);
    // The panel settles toward the camera rather than sliding in from an edge —
    // an edge slide would imply a direction the next shot has to honour.
    panel.style.transform = `translate(-50%, -50%) scale(${lerp(0.965, 1, inPanel).toFixed(5)})`;

    let landed = 0;
    msgs.forEach((m, i) => {
      const p = seg(t, ALERT_AT[i], 0.55);
      if (p > 0) landed = i + 1;
      m.style.opacity = p.toFixed(4);
      m.style.transform = `translateY(${lerp(22, 0, p).toFixed(3)}px)`;
    });
    // No scroll lift: the feed is sized for exactly these four, so each card
    // lands in its own slot. An earlier version lifted the feed as it filled and
    // drove the first card up behind the channel header — motion for its own
    // sake, and broken motion at that.
    void landed;
    void feed;
  },
};


// ── scene: burst ──────────────────────────────────────────────────────────────
// Scene 7 of the film ("unlock"), authored here in scene-local time 0..1.85.
// In the finished cut it starts at 14.45s.
//
// This is the beat the film is judged on. The teardown measured the reference's
// burst at ~4x the frame-delta of any other beat, sustained for 2.0s, and the
// adversarial pass was blunt: a DARK pinwheel "is the one that gets it rejected
// a fifth time". Hence white wedges. In a monochrome system white IS the accent
// (#f5f5f4 on #0a0a0a is 18.15:1), and the twelve --bg wedges are free because
// they are simply the ground showing through.
//
// The three pills are what ACTUALLY happens in these seconds. An earlier draft
// streamed '# vip-lounge', '# signals', 'general' — but Dues does not create,
// configure or gate channels. It delivers a ROLE; what that role opens is the
// server owner's own permission setup. Claiming otherwise would be the one
// failure worse than boring.
const PILLS = [
  { label: 'Payment captured', bg: '#635bff', fg: '#ffffff', ang: -142, dist: 232 },
  { label: '@VIP added', bg: '#5865f2', fg: '#ffffff', ang: -38, dist: 246 },
  { label: 'Posted to #sale-alerts', bg: '#f5f5f4', fg: '#0a0a0a', ang: 96, dist: 238 },
];
const PILL_AT = [0.50, 0.66, 0.82];

// Eight four-point stars on a fixed deterministic ring. The reference scatters
// coral sparkles through its ray field and they are a real part of why the beat
// reads as celebratory rather than merely fast. Hardcoded angles, never random:
// the film must render identically forever.
const STARS = [
  [18, 300, 1.0], [64, 430, 0.62], [112, 355, 0.85], [158, 470, 0.5],
  [206, 320, 0.95], [252, 445, 0.58], [298, 375, 0.78], [344, 495, 0.66],
];

const BURST = {
  duration: 1.85,
  build() {
    const stars = document.querySelector('#burst .stars');
    stars.innerHTML = STARS.map(([a, r, sc]) => {
      const x = 960 + Math.cos((a * Math.PI) / 180) * r;
      const y = 540 + Math.sin((a * Math.PI) / 180) * r;
      const s = 46 * sc;
      return `<svg style="left:${(x - s / 2).toFixed(1)}px;top:${(y - s / 2).toFixed(1)}px" width="${s}" height="${s}" viewBox="-50 -50 100 100">
        <path d="M0-50C0-18-18 0-50 0-18 0 0 18 0 50 0 18 18 0 50 0 18 0 0-18 0-50Z" fill="#f5f5f4"/></svg>`;
    }).join('');

    const group = document.querySelector('#burst .group');
    group.insertAdjacentHTML('beforeend', PILLS.map((p) => {
      const x = Math.cos((p.ang * Math.PI) / 180) * p.dist;
      const y = Math.sin((p.ang * Math.PI) / 180) * p.dist;
      return `<div class="pill" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}"
        style="background:${p.bg};color:${p.fg}">${p.label}</div>`;
    }).join(''));
  },
  apply(t) {
    const wrap = document.querySelector('#burst .wheelwrap');
    const wheel = document.querySelector('#burst .wheel');
    const stars = document.querySelector('#burst .stars');
    const group = document.querySelector('#burst .group');
    const chip = document.querySelector('#burst .chip');
    const bloom = document.querySelector('#burst .bloom');

    // GROWTH. A constant x3 ratio per source frame, masked rather than scaled.
    // The feather is not decoration: the reference's first two frames have
    // radially smeared ray tips, not a hard disc.
    const radius = Math.min(2600, Math.pow(3, t * 25) * 8);
    const feather = Math.max(40, radius * 0.16);
    const mask = `radial-gradient(circle at 50% 50%, #000 0 ${(radius - feather).toFixed(1)}px, transparent ${radius.toFixed(1)}px)`;
    wheel.style.webkitMaskImage = mask;
    wheel.style.maskImage = mask;

    // SPIN. Dead constant -128.7 deg/s from the first frame it exists to the
    // last — measured sd 0.25 deg/frame over 40 samples. Any ease-in or
    // ease-out here reads as a different, cheaper effect.
    const spin = -128.7 * t;
    wheel.style.transform = `rotate(${spin.toFixed(3)}deg)`;
    stars.style.transform = `rotate(${spin.toFixed(3)}deg) scale(${(1 + 0.06 * Math.sin(t * 7.5)).toFixed(4)})`;

    // IGNITION AT THE CURSOR, not at frame centre. The burst is born at the pay
    // button (954,726) and the camera pulls it to centre over 0.30s. Motivation
    // is what separates this from a stock transition.
    const pull = seg(t, 0, 0.30);
    wrap.style.transform = `translate(${lerp(-6, 0, pull).toFixed(2)}px, ${lerp(186, 0, pull).toFixed(2)}px)`;

    // THE ONLY SPRING IN THE FILM. theta = A e^(-zwu) cos(wd u), z=0.27,
    // w=5.5 rad/s, A=27deg, starting 0.123s in. Its acceptance test is three
    // measured points: it crosses zero at film-time 14.87 and reaches its
    // extremum of -11.0deg at 15.17. It crosses zero and comes BACK, so
    // easeOutBack is not a substitute. Nothing else in the film overshoots.
    const u = Math.max(0, t - 0.123);
    const wd = 5.5 * Math.sqrt(1 - 0.27 * 0.27);
    const theta = 27 * Math.exp(-0.27 * 5.5 * u) * Math.cos(wd * u);
    const pop = seg(t, 0.02, 0.34);

    // Chip and pills share ONE perspective group: the measured fact that the
    // pills scale ~1.35x faster than the chip falls out of a single camera
    // curve instead of three hand-tuned tracks.
    const camZ = lerp(-260, 300, seg(t, 0.05, 1.25));
    group.style.transform = `translateZ(${camZ.toFixed(1)}px)`;

    const exit = seg(t, 1.62, 0.23, (x) => x); // linear: the swap must land hard
    chip.style.opacity = pop.toFixed(4);
    chip.style.transform =
      `translate(-50%,-50%) rotate(${theta.toFixed(3)}deg) scale(${(lerp(0.35, 1, pop) * lerp(1, 0.79, exit)).toFixed(4)})`;

    document.querySelectorAll('#burst .pill').forEach((el, i) => {
      const p = seg(t, PILL_AT[i], 0.42);
      const x = Number(el.dataset.x) * p;
      const y = Number(el.dataset.y) * p;
      el.style.opacity = (p * (1 - exit)).toFixed(4);
      el.style.transform = `translate(-50%,-50%) translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 550px) scale(${lerp(0.6, 1, p).toFixed(4)})`;
    });

    // EXIT. The blur lands on the WHEEL WRAPPER ONLY. The bloom and the blur
    // must peak on the swap frame: one frame early or late, while readable ray
    // structure survives, and it reads as a cut.
    wrap.style.filter = exit > 0 ? `blur(${(36 * exit).toFixed(1)}px)` : 'none';
    const bl = seg(t, 1.65, 0.10);
    bloom.style.opacity = (bl * (1 - seg(t, 1.80, 0.05))).toFixed(4);
    bloom.style.transform = `translate(-50%,-50%) scale(${lerp(0.2, 3, bl).toFixed(3)})`;
  },
};

const SCENES = { brand: BRAND, burst: BURST, alerts: ALERTS };

const name = new URLSearchParams(location.search).get('scene') || 'brand';
const scene = SCENES[name];
if (!scene) {
  document.body.innerHTML = `<pre style="color:#f5f5f4;padding:40px;font:20px monospace">
unknown scene "${name}" — known: ${Object.keys(SCENES).join(', ')}</pre>`;
} else {
  document.getElementById(name).classList.add('on');
  if (scene.build) scene.build();
  scene.apply(0);
}

// The recorder's whole contract with this page.
window.__scene = name;
window.__duration = scene ? scene.duration : 0;
window.__seek = (t) => {
  if (!scene) return false;
  scene.apply(Number(t));
  return true;
};
// Set once the fonts AND every image have resolved. Fonts alone was not enough:
// frame 0's subject is assets/dues-mark.png and frame 0 becomes the LCP poster, so
// seeking before it decodes ships a poster with a hole where the logo goes.
window.__ready = false;
Promise.all([
  document.fonts.ready,
  ...[...document.images].map((i) => i.decode().catch(() => {})),
]).then(() => { window.__ready = true; });
</script>
</body>
</html>
