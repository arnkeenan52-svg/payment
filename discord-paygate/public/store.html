<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- og:begin — replaced per store by api/store-page.js so link previews
       (Discord/Twitter/iMessage) carry the store's name and product photo.
       Unfurlers never run JS; only server-rendered tags count. -->
  <title>Checkout — Ripley</title>
  <meta name="description" content="Secure checkout for Discord communities — pay once, roles delivered in seconds." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Checkout — Ripley" />
  <meta property="og:description" content="Secure checkout for Discord communities — pay once, roles delivered in seconds." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Checkout — Ripley" />
  <meta name="twitter:description" content="Secure checkout for Discord communities — pay once, roles delivered in seconds." />
  <!-- og:end -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css?v=38" />
</head>
<body>
  <header class="top">
    <div class="top-left">
      <a href="/"><img class="platform-mark" src="/ripley.png" alt="Ripley" height="18" /></a>
    </div>
    <div id="account" class="account"></div>
  </header>

  <main class="checkout">
    <section class="panel order-card">
      <h1 class="order-title">Confirm Order</h1>
      <p class="order-sub">You are about to purchase the following product:</p>

      <div class="order-product">
        <div class="op-left">
          <img class="op-thumb" id="product-shot" alt="" hidden onerror="this.hidden = true" />
          <span class="op-name" id="plan-name">&nbsp;</span>
        </div>
        <span class="op-price" id="price">&nbsp;</span>
        <div class="op-server">
          <img class="logo op-server-icon" src="" alt="" width="34" height="34" hidden />
          <span class="op-server-meta"><strong id="server-name" hidden></strong><span class="op-server-kind">Discord Server</span></span>
        </div>
      </div>

      <div class="order-roles" id="roles-box" hidden>
        <span class="order-roles-label">Discord Roles Included:</span>
        <span class="chips" id="roles-chips"></span>
      </div>

      <p class="tagline" id="plan-desc"></p>
      <div id="notice"></div>

      <p class="label" id="options-label">Select Option</p>
      <div id="options"></div>

      <p class="label">Payment Method:</p>
      <div class="methods" id="methods"></div>

      <section class="pay-panel" id="pay-panel">
        <h2 id="pay-title">Pay with Card</h2>
        <p class="pay-sub" id="pay-sub">Secure payment processed by Stripe</p>
        <details class="order-extra" id="discount-field" hidden>
          <summary id="discount-summary">Have a discount code?</summary>
          <div class="order-extra-body">
            <span class="discount-row">
              <input id="discount-code" type="text" maxlength="32" placeholder="LAUNCH20" spellcheck="false" autocomplete="off" style="text-transform:uppercase" aria-label="Discount code" />
              <button type="button" class="apply-btn" id="discount-apply">Apply</button>
            </span>
            <p class="discount-msg" id="discount-msg" role="status"></p>
          </div>
        </details>
        <div id="cta-area"></div>
        <p class="redirect-note" id="redirect-note"></p>
        <div class="trust-row" id="trust-row"></div>
      </section>
    </section>

    <div id="error-slot"></div>
  </main>

  <footer>
    <span class="powered-label">Checkout powered by:</span>
    <img class="powered-mark" src="/ripley.png" alt="Ripley" height="18" />
  </footer>

  <script src="/app.js?v=38"></script>
</body>
</html>
