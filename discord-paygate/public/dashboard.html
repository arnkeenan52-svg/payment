<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Ripley</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-left">
      <a href="/"><img class="platform-mark" src="/ripley.png" alt="Ripley" height="18" /></a>
    </div>
    <div id="account" class="account">
      <a class="nav-link" href="/">Store</a>
      <a class="nav-link" href="/diagnostics">Diagnostics</a>
    </div>
  </header>

  <main class="checkout wide">
    <div class="brand">
      <h1>Dashboard</h1>
      <p class="tagline">All-time payments across your store.</p>
    </div>
    <div id="content"></div>
  </main>

  <footer>
    <span class="powered-label">Powered by:</span>
    <img class="powered-mark" src="/ripley.png" alt="Ripley" height="18" />
  </footer>

  <script src="/dashboard.js"></script>
</body>
</html>
