<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#131b2d" />
  <title>Dashboard — Dues</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=162" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=162" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css?v=162" />
  <style>
    /* Navy night retheme — colors only. Remaps the old "Dues black" monochrome
       tokens from styles.css onto the brand's navy system (the landing page's
       night :root). Scoped to the dark face; html[data-theme="light"] keeps the
       stylesheet's own light values untouched. */
    html:not([data-theme='light']) {
      --bg: #101827;                       /* page ground */
      --panel: #182338;                    /* raised panels / cards */
      --panel-hover: #1e2b45;
      --edge: rgba(148, 163, 190, 0.16);   /* hairline borders */
      --edge-selected: #5865f2;            /* selection rings: blurple */
      --ink: #f2f5fa;                      /* primary text */
      --dim: #b7c1d4;                      /* secondary text */
      --accent: #5865f2;                   /* blurple replaces the white action color */
      --accent-hot: #4752e8;
      --accent-ink: #ffffff;
      --well: #131b2d;                     /* deeper insets */
      --raised: #1c2740;
      --hairline: rgba(148, 163, 190, 0.10);
      --hairline-2: rgba(148, 163, 190, 0.14);
      --edge-hot: rgba(148, 163, 190, 0.32);
      --active-fill: #223050;
      --faint: #94a0b5;                    /* muted */
      --solid: #5865f2;                    /* white primary fills -> blurple */
      --solid-ink: #ffffff;
      --good: #3ddc84;                     /* positive money green */
      --money: #3ddc84;
    }
    html:not([data-theme='light']) ::selection { background: rgba(88, 101, 242, 0.45); color: #f2f5fa; }

    /* Day-sky light face — the light blue, not the old off-white. Scoped the
       same way the navy block is: html[data-theme='light'] only. */
    html[data-theme='light'] {
      --bg: #e9f1fb;                       /* clearly light-blue ground */
      --panel: #ffffff;
      --panel-hover: #f2f7fd;
      --edge: #cfdff2;
      --edge-selected: #5865f2;
      --ink: #0f1626;
      --dim: #46536e;
      --accent: #5865f2;
      --accent-hot: #4752e8;
      --accent-ink: #ffffff;
      --well: #ddeaf8;
      --raised: #f3f8fd;
      --hairline: #dbe7f5;
      --hairline-2: #cfdff2;
      --edge-hot: #a9c3e2;
      --active-fill: #dce9f8;
      --faint: #93a7c4;
      --solid: #5865f2;
      --solid-ink: #ffffff;
      --good: #177245;
      --money: #177245;
    }
    /* a whisper of sky at the top of the page ground */
    html[data-theme='light'] body { background: linear-gradient(180deg, #d5e5f8 0%, #e9f1fb 300px) fixed; }
    html[data-theme='light'] ::selection { background: rgba(88, 101, 242, 0.25); color: #0f1626; }

    /* primary action pill: the mono grey fill becomes the brand blurple,
       matching the landing's sign-in pill (body.home .account .btn-pill) */
    html:not([data-theme='light']) .btn-pill { background: var(--blurple); border-color: transparent; color: #ffffff; }
    html:not([data-theme='light']) .btn-pill:hover { background: #4752e8; filter: none; }
    /* literal monochrome / off-palette colors in styles.css, remapped */
    html:not([data-theme='light']) .pay-btn:hover:not(:disabled) { background: #4752e8; }
    html:not([data-theme='light']) .btn-blurple:hover { background: #4752e8; }
    html:not([data-theme='light']) .dcx-btn.press { background: #4752e8; }
    html:not([data-theme='light']) .error-actions .dismiss:hover { background: var(--active-fill); }
    html:not([data-theme='light']) .chart-tip { background: rgba(19, 27, 45, 0.92); }
    html:not([data-theme='light']) .top-bar span { background: linear-gradient(90deg, rgba(61, 220, 132, 0.42), rgba(61, 220, 132, 0.82)); }
    html:not([data-theme='light']) .th-tile:hover .th-tile-thumb { border-color: rgba(148, 163, 190, 0.4); }
    html:not([data-theme='light']) .th-tile:focus-visible .th-tile-thumb { outline-color: #5865f2; }
    html:not([data-theme='light']) .th-tile.active .th-tile-thumb { border-color: #5865f2; }
    html:not([data-theme='light']) .th-frame-bar { background: #131b2d; }
    html:not([data-theme='light']) .th-frame-dot { background: rgba(148, 163, 190, 0.28); }
    html:not([data-theme='light']) .th-frame-url { background: #101827; border-color: rgba(148, 163, 190, 0.14); }
    /* focus rings: blurple (the blurple pay/primary buttons keep their legible pale ring) */
    html:not([data-theme='light']) .btn-fill:focus-visible,
    html:not([data-theme='light']) .btn-secondary:focus-visible,
    html:not([data-theme='light']) .powered-community:focus-visible,
    html:not([data-theme='light']) .field textarea:focus-visible,
    html:not([data-theme='light']) .th-swatch input[type='color']:focus-visible,
    html:not([data-theme='light']) .th-seg-btn:focus-visible,
    html:not([data-theme='light']) .th-dev-btn:focus-visible { outline-color: #5865f2; }
    html:not([data-theme='light']) .th-range input,
    html:not([data-theme='light']) .disc-toggle input { accent-color: #5865f2; }
  </style>
  <script src="/theme.js?v=162"></script>
</head>
<body class="app">
  <header class="top">
    <div class="top-left">
      <a href="/"><img class="platform-mark" src="/dues.png?v=162" alt="Dues" height="20" /></a>
    </div>
    <div class="top-right">
      <div id="account" class="account"></div>
      <button class="theme-btn" data-theme-toggle aria-label="Switch color theme"><svg class="tb-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M19 5l-1.6 1.6M6.6 17.4L5 19"/></svg><svg class="tb-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>

  <main class="app-main">
    <div id="content"></div>
  </main>

  <script src="/dashboard.js?v=162"></script>
</body>
</html>
