<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premium — Tradeleaks</title>
  <link rel="icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <img class="platform-mark" src="/ripley.png" alt="Ripley" height="20" />
    <div id="account" class="account"></div>
  </header>

  <main class="checkout">
    <div class="brand">
      <img class="logo" src="/logo.png" alt="Tradeleaks" width="84" height="84" />
      <h1 id="plan-name">&nbsp;</h1>
      <p class="brand-name" id="server-name">Tradeleaks</p>
      <p class="tagline" id="plan-desc"></p>
    </div>

    <div id="notice"></div>

    <section class="panel row-panel">
      <span class="row-label">Price</span>
      <span class="row-value" id="price">&nbsp;</span>
    </section>

    <section class="panel" id="options-panel" hidden>
      <p class="label">Select option</p>
      <div id="options"></div>
    </section>

    <div class="methods" id="methods"></div>

    <section class="panel pay-panel" id="pay-panel">
      <div class="pay-head">
        <h2 id="pay-title">Pay with Card</h2>
        <span class="pill" id="pay-pill">0% added fees</span>
      </div>
      <p class="pay-sub" id="pay-sub">Pay with card or debit. Payment goes directly to the server owner via Stripe.</p>
      <div class="trust-row" id="trust-row"></div>
      <div id="cta-area"></div>
      <p class="redirect-note" id="redirect-note"></p>
    </section>

    <p class="fineprint" id="fineprint">One-time payment, lifetime access — your role lands the moment payment confirms.</p>
  </main>

  <footer>
    <span class="powered-label">Checkout powered by:</span>
    <img class="powered-mark" src="/ripley.png" alt="Ripley" height="18" />
  </footer>

  <script src="/app.js"></script>
</body>
</html>
